name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: '.claude/scripts/package-lock.json'
        
    - name: Install dependencies
      working-directory: .claude/scripts
      run: npm ci

    - name: Run Tests
      working-directory: .claude/scripts
      run: npm run test
